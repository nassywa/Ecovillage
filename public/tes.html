
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tes Tema EcoVillage</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">

    <!-- JavaScript -->
    <script src="js/theme.js" defer></script>
    <script src="js/navigation.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="site-header__inner">

            <!-- LOGO DAN IDENTITAS DESA -->
            <a href="#" class="site-brand">
                <span class="site-brand__logo">🌿</span>

                <span class="site-brand__text">
                    <span class="site-brand__name">
                        EcoVillage
                    </span>

                    <span class="site-brand__location">
                        Desa Marga Mulya
                    </span>
                </span>
            </a>

            <!-- MENU NAVIGASI -->
            <nav class="site-nav" id="main-navigation">
                <a href="#" aria-current="page">Beranda</a>
                <a href="#">Profil Desa</a>
                <a href="#">Potensi Desa</a>
                <a href="#">Berita</a>
            </nav>

            <!-- TOMBOL KANAN -->
            <div class="header-actions">

                <!-- TOMBOL GANTI TEMA -->
                <button class="theme-toggle" type="button">
                    ☀
                </button>

                <!-- TOMBOL LAPOR DESA -->
                <a href="#" class="header-lapor">
                    Lapor Desa
                </a>

                <!-- TOMBOL LOGIN -->
                <a href="#" class="header-login">
                    Login
                </a>

                <!-- TOMBOL HAMBURGER -->
                <button
                    class="nav-toggle"
                    type="button"
                    aria-label="Buka menu navigasi"
                    aria-expanded="false"
                    aria-controls="main-navigation"
                >
                    ☰
                </button>

            </div>

        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container">
        <h2>Selamat Datang di Desa Marga Mulya</h2>

        <p>
            Ini adalah halaman pengujian tema EcoVillage.
        </p>

        <button type="button">
            Pelajari Lebih Lanjut
        </button>
    </main>

</body>
</html>
